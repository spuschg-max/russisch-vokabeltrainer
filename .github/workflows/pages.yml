name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freien A1/A2- und B1-Standardwortschatz erzeugen
        run: python3 scripts/build_standard_vocab.py
      - name: Konjugationen und Betonungen ergänzen
        run: python3 scripts/enrich_conjugations.py
      - name: Allgemeines Betonungslexikon erzeugen
        run: python3 scripts/build_stress_lexicon.py
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Website verpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
