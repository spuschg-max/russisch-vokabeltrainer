name: Qualitätsprüfung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript-Syntax prüfen
        run: |
          node --check app.js
          node --check data.js
          node --check features.js
          node --check speaking.js
          node --check forms.js
          node --check voice-persistence.js
          node --check forms-voice.js
          node --check audio-toggle.js
          node --check speech-unlock.js
          node --check speech-tolerance.js
          node --check speech-segmentation.js
          node --check speech-start-guard.js
          node --check voice-controller.js
          node --check voice-selfcheck.js
          node --check wrong-study-pause.js
          node --check voice-add.js
          node --check learning-ui.js
          node --check motion-hints.js
          node --check reveal-answer.js
          node --check problem-vocab.js
          node --check stress-lexicon-data.js
          node --check stress-display.js
          node --check sentence-lazy-loader.js
          node --check sentence-drill.js
          node --check sentence-voice-loop.js
          node --check conjugation-data-bridge.js
          node --check conjugation-drill.js
          node --check conjugation-study.js
          node --check update-helper.js
          node --check exercise-packages.js
          node --check standard-pack.js
          node --check service-worker.js
          python3 -m py_compile scripts/build_standard_vocab.py scripts/enrich_conjugations.py scripts/build_stress_lexicon.py scripts/build_sentence_bank.py scripts/accent_sentence_bank.py scripts/annotate_sentence_cases.py
      - name: Pflichtdateien prüfen
        run: |
          test -s index.html
          test -s styles.css
          test -s manifest.webmanifest
          test -s app-icon.svg
          test -s speaking.js
          test -s forms.js
          test -s voice-persistence.js
          test -s forms-voice.js
          test -s audio-toggle.js
          test -s speech-unlock.js
          test -s speech-tolerance.js
          test -s speech-segmentation.js
          test -s speech-start-guard.js
          test -s voice-controller.js
          test -s voice-selfcheck.js
          test -s wrong-study-pause.js
          test -s voice-add.js
          test -s learning-ui.js
          test -s motion-hints.js
          test -s reveal-answer.js
          test -s problem-vocab.js
          test -s stress-lexicon-data.js
          test -s stress-display.js
          test -s sentence-lazy-loader.js
          test -s sentence-drill.js
          test -s sentence-voice-loop.js
          test -s conjugation-data-bridge.js
          test -s conjugation-drill.js
          test -s conjugation-study.js
          test -s update-helper.js
          test -s exercise-packages.js
          test -s standard-pack.js
          test -s scripts/build_standard_vocab.py
          test -s scripts/enrich_conjugations.py
          test -s scripts/build_stress_lexicon.py
          test -s scripts/build_sentence_bank.py
          test -s scripts/accent_sentence_bank.py
          test -s scripts/annotate_sentence_cases.py
          grep -q 'id="learnCard"' index.html
          grep -q 'id="discardCurrent"' index.html
          grep -q 'id="installApp"' index.html
          grep -q 'speaking.js' index.html
          grep -q 'forms.js' index.html
          grep -q 'voice-persistence.js' index.html
          grep -q 'Legacy-Sprachsteuerung dauerhaft deaktiviert' voice-persistence.js
          grep -q 'forms-voice.js' index.html
          grep -q 'stress-lexicon-data.js' index.html
          grep -q 'update-helper.js' index.html
          grep -q 'exercise-packages.js' index.html
          grep -q 'standard-a1a2-data.js' index.html
          grep -q 'standard-b1-data.js' index.html
          grep -q 'standard-pack.js' index.html
          grep -q 'SMARTool_data_B1.csv' scripts/build_standard_vocab.py
          grep -q 'enrich_conjugations.py' .github/workflows/pages.yml
          grep -q 'build_stress_lexicon.py' .github/workflows/pages.yml
          grep -q 'build_sentence_bank.py' .github/workflows/pages.yml
          grep -q 'accent_sentence_bank.py' .github/workflows/pages.yml
          grep -q 'annotate_sentence_cases.py' .github/workflows/pages.yml
          grep -q 'id="sentenceCase"' sentence-drill.js
          grep -q 'sentence-lazy-loader.js' update-helper.js
          grep -q 'sentence-lazy-loader.js' service-worker.js
          grep -q 'sentence-voice-loop.js' update-helper.js
          grep -q 'sentence-voice-loop.js' service-worker.js
          grep -q 'DEFAULT_VOCABULARY' data.js
