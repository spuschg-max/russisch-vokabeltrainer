name: Qualitätsprüfung

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript-Syntax prüfen
        run: |
          for f in app.js data.js features.js speaking.js forms.js voice-persistence.js forms-voice.js audio-toggle.js speech-unlock.js speech-tolerance.js speech-segmentation.js speech-start-guard.js voice-controller.js voice-selfcheck.js wrong-study-pause.js voice-add.js learning-ui.js motion-hints.js reveal-answer.js problem-vocab.js stress-display.js sentence-lazy-loader.js sentence-drill.js sentence-ui-guard.js conjugation-data-bridge.js conjugation-drill.js conjugation-study.js update-helper.js exercise-packages.js standard-pack.js service-worker.js; do
            node --check "$f"
          done
      - name: Stabilen Vokabelkern und iOS-Kartenwechsel prüfen
        run: |
          test "$(git hash-object problem-vocab.js)" = "599eef4fb9ab9e92f8e20c4bd56ed1598f611ed6"
          test "$(git hash-object speech-unlock.js)" = "551f97a04e2af4410d8d2be3af8617a1e2b9cdf2"
          grep -q 'r.continuous=false' voice-controller.js
          ! grep -q 'continuous=true' voice-controller.js
          grep -q 'scheduleFreshRecognition' voice-controller.js
          grep -q 'stopRecognition(false);enableAnswerControls' voice-controller.js
          ! grep -q "loadScript('speech-start-guard.js'" update-helper.js
          ! grep -q "loadScript('voice-selfcheck.js'" update-helper.js
          ! grep -q "loadScript('wrong-study-pause.js'" update-helper.js
          grep -q 'speech-start-guard.js' service-worker.js
          grep -q 'voice-selfcheck.js' service-worker.js
          grep -q 'wrong-study-pause.js' service-worker.js
          grep -q 'rvt-stress-overlay' stress-display.js
          grep -q 'rvt-stressed-vowel' stress-display.js
          ! grep -q 'observe(document.body' stress-display.js
          grep -q "await loadScript('stress-display.js'" update-helper.js
          grep -q 'Legacy-Sprachsteuerung dauerhaft deaktiviert' voice-persistence.js
          grep -q "const BUILD='2026.09.03.71'" update-helper.js
          grep -q "sentence-lazy-loader.js" update-helper.js
          ! grep -q "sentence-bank-data.js" update-helper.js
          grep -q "russisch-vokabeltrainer-v81" service-worker.js
      - name: Satz- und Kasusmodul prüfen
        run: |
          grep -q 'id="sentenceCase"' sentence-drill.js
          grep -q 'sentence-bank-data.js' sentence-lazy-loader.js
          grep -q 'sentence-ui-guard.js' sentence-lazy-loader.js
          python3 -m py_compile scripts/build_standard_vocab.py scripts/enrich_conjugations.py scripts/build_stress_lexicon.py scripts/build_sentence_bank.py scripts/accent_sentence_bank.py scripts/annotate_sentence_cases.py
          grep -q 'annotate_sentence_cases.py' .github/workflows/pages.yml